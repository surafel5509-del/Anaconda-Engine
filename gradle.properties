# ============================================================================
# Gradle properties for Anaconda-Engine
# ============================================================================

# JVM memory — NDK + Kotlin/Compose compilation is memory hungry.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# CI stability: compile Kotlin INSIDE the Gradle daemon (no separate Kotlin
# daemon process). GitHub runners intermittently fail to fork that daemon —
# "The daemon has terminated unexpectedly on startup attempt #1" killed the
# whole build before any diagnostics could run. One process also removes
# the Gradle↔Kotlin daemon handshake from the failure surface.
kotlin.compiler.execution.strategy=in-process

# Build performance: configure-on-demand + parallel project execution.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX is mandatory for AGP 8.x (support libraries are dead).
android.useAndroidX=true

# Non-transitive R classes: each module only sees its own resources.
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official

# Keep R class shrinking predictable for the editor app.
android.enableAppCompileTimeRClass=true
